name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test -- --runInBand

  yarn-consumers:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - mode: classic
            yarn-package: yarn@1.22.22
          - mode: node-modules
            yarn-package: '@yarnpkg/cli-dist@4.18.1'
          - mode: pnp
            yarn-package: '@yarnpkg/cli-dist@4.18.1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Install Yarn
        env:
          YARN_PACKAGE: ${{ matrix.yarn-package }}
        run: npm install --global "$YARN_PACKAGE"
      - run: npm run test:yarn -- ${{ matrix.mode }}
