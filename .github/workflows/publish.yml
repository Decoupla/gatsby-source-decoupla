name: Publish to npm
run-name: Publish ${{ inputs.version }} release from main

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version increment
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  prepare:
    name: Verify and prepare release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      - name: Require main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Publishing is only allowed from main."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Require the current main commit
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "::error::Main changed since this run was requested. Start a new publish run."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Increment version locally
        id: version
        env:
          VERSION_INCREMENT: ${{ inputs.version }}
        run: |
          case "$VERSION_INCREMENT" in
            patch|minor|major) ;;
            *) echo "::error::Invalid version increment."; exit 1 ;;
          esac
          npm version "$VERSION_INCREMENT" --no-git-tag-version --ignore-scripts
          echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
      - name: Build versioned package
        run: npm run build
      - name: Run unit tests
        run: npm test -- --runInBand
      - name: Pack tested build
        id: pack
        run: |
          mkdir -p "$RUNNER_TEMP/npm-release"
          npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP/npm-release" > "$RUNNER_TEMP/npm-release/pack.json"
          echo "tarball=$(node -p 'Object.values(require(process.env.RUNNER_TEMP + "/npm-release/pack.json"))[0].filename')" >> "$GITHUB_OUTPUT"
      - name: Save tested package for publishing and retries
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm-release/*.tgz
          if-no-files-found: error
          retention-days: 7
      - name: Push version commit and tag
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Recheck immediately before writing; the atomic push also rejects competing updates.
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "::error::Main changed while checks ran. Start a new publish run."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: release v$RELEASE_VERSION"
          git tag "v$RELEASE_VERSION"
          git push --atomic origin HEAD:refs/heads/main "refs/tags/v$RELEASE_VERSION"

  publish:
    name: Publish tested package
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: release-package
      - name: Publish to npm using trusted publishing
        working-directory: release-package
        env:
          PACKAGE_TARBALL: ${{ needs.prepare.outputs.tarball }}
        run: npm publish "$PACKAGE_TARBALL" --access public --ignore-scripts --registry=https://registry.npmjs.org/
      - name: Record published version
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: echo "Published v$RELEASE_VERSION to npm." >> "$GITHUB_STEP_SUMMARY"
